<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>多貓健康日記 V1.1</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#28333a;background:#f6f8f7}*{box-sizing:border-box}body{margin:0}.app{max-width:640px;margin:auto;padding:18px 15px 80px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:8px 0}button,select,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:9px 13px;background:#e5efed;color:#244b48}button.primary{background:#27877e;color:white}.card{background:white;border-radius:18px;padding:15px;margin:15px 0;box-shadow:0 3px 16px #1c3d3810}.muted{color:#71817e;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}select,input,textarea{border:1px solid #dbe5e2;border-radius:10px;padding:10px;background:white;max-width:100%}select{flex:1}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week{color:#81908b;font-size:13px;margin:16px 0 5px}.day{min-height:64px;border-radius:12px;background:transparent;padding:7px 2px;display:flex;align-items:center;flex-direction:column;gap:5px}.day.selected{background:#e4f3f0}.day.today .num{border:1px solid #27877e;border-radius:50%;width:27px;height:27px;display:grid;place-items:center}.dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}.dot{width:7px;height:7px;border-radius:50%}.stats{display:flex;gap:8px;flex-wrap:wrap}.chip{font-size:13px;background:#f3f6f5;border-radius:20px;padding:7px 10px}.entry{border-top:1px solid #eef1f0;padding:13px 0}.entry:first-of-type{border-top:0}.entry img{width:76px;height:76px;object-fit:cover;border-radius:10px;margin:5px 5px 0 0}.badge{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.fab{position:fixed;right:max(20px,calc((100vw - 640px)/2 + 20px));bottom:24px;border-radius:30px;box-shadow:0 4px 15px #0002;padding:14px 20px}dialog{border:0;border-radius:18px;width:min(94vw,520px);max-height:90vh;overflow:auto;padding:20px}dialog::backdrop{background:#0007}label{display:block;margin:12px 0 5px;font-size:14px}textarea{width:100%;min-height:95px}input[type=date],input[type=time],input[type=text]{width:100%}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.small{font-size:12px}.photos{display:flex;flex-wrap:wrap;gap:6px}.photos img{width:72px;height:72px;object-fit:cover;border-radius:8px}.hint{padding:9px;background:#fff8e7;border-radius:10px;font-size:12px;color:#795c25;margin:12px 0}</style><meta name="theme-color" content="#27877e"></head><body><main class="app"><header><div><div class="muted">🐾 我的貓咪生活紀錄</div><h1>多貓健康日記</h1></div><button id="settings">⚙️ 設定</button></header><div class="hint">V1.1 手機測試版：紀錄暫存於此瀏覽器，尚未雲端同步。照片過多可能超過瀏覽器儲存容量，請勿作為唯一備份。</div><div class="card"><div class="row"><span>🐱</span><select id="cat"></select><button id="addCat">＋貓咪</button></div></div><section class="card"><div class="row between"><button id="prev">‹</button><strong id="month"></strong><button id="next">›</button></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="grid" class="grid"></div><div class="row between" style="margin-top:10px"><span class="muted" id="filter"></span><button id="clear">顯示整月</button></div></section><section class="card"><h3>本月事件統計</h3><div id="stats" class="stats"></div></section><section class="card"><div class="row between"><h3 id="listTitle">紀錄列表</h3><span class="muted" id="count"></span></div><div id="entries"></div></section><button class="primary fab" id="new">＋ 新增紀錄</button></main><dialog id="editor"><h3 id="editorTitle">新增紀錄</h3><form id="form"><label>日期</label><input id="date" type="date" required><label>時間（選填）</label><input id="time" type="time"><label>事件類別</label><select id="category"></select><label>文字紀錄</label><textarea id="note" placeholder="今天發生什麼事？"></textarea><label>照片（可多選；建議小檔案）</label><input id="files" type="file" accept="image/*" multiple><div id="photoPreview" class="photos"></div><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">儲存</button></div></form></dialog><dialog id="settingsDialog"><h3>事件分類與顏色</h3><p class="muted">所有貓咪共用。修改分類名稱及顏色後，既有紀錄也會同步更新。</p><div id="categories"></div><div class="row"><input id="newCategory" type="text" placeholder="新增分類名稱" style="flex:1"><input id="newColor" type="color" value="#459dd6"><button id="addCategory">新增</button></div><div class="actions"><button class="primary" id="closeSettings">完成</button></div></dialog><script>
const KEY='catDiaryPrototype_v1';const defaults={cats:[{id:'c1',name:'小橘'},{id:'c2',name:'咪咪'}],categories:[['嘔吐','#3989dc'],['用藥','#4ba66a'],['看診','#e4b535'],['異常狀況','#e26666'],['排泄異常','#9367d1'],['疫苗','#ed8c42'],['體重','#97725a'],['其他','#8b959d'],['生活日記','#e789b1'],['飲食','#52bac6']].map((a,i)=>({id:'t'+i,name:a[0],color:a[1]})),entries:[]};let data;try{data=JSON.parse(localStorage.getItem(KEY))||JSON.parse(JSON.stringify(defaults))}catch{data=JSON.parse(JSON.stringify(defaults))}let catId=data.cats[0]?.id,now=new Date(),year=now.getFullYear(),month=now.getMonth(),selected=null,editId=null,keptPhotos=[];const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('儲存失敗，可能是照片過大或瀏覽器空間不足。請縮小照片再試。');return false}}function iso(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cats(){ $('cat').innerHTML=data.cats.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');$('cat').value=catId}function category(id){return data.categories.find(c=>c.id===id)||{name:'未分類',color:'#999'}}function filtered(){return data.entries.filter(e=>e.catId===catId&&e.date.startsWith(`${year}-${String(month+1).padStart(2,'0')}`))}function render(){cats();$('month').textContent=`${year} 年 ${month+1} 月`;let list=filtered();let first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();$('grid').innerHTML='';for(let i=0;i<first;i++)$('grid').append(document.createElement('div'));for(let d=1;d<=days;d++){let date=iso(year,month,d),daily=list.filter(e=>e.date===date),colors=[...new Set(daily.map(e=>category(e.categoryId).color))],b=document.createElement('button');b.className='day'+(selected===date?' selected':'')+(date===iso(now.getFullYear(),now.getMonth(),now.getDate())?' today':'');b.innerHTML=`<span class="num">${d}</span><span class="dots">${colors.slice(0,5).map(c=>`<span class="dot" style="background:${c}"></span>`).join('')}${colors.length>5?'<small>+</small>':''}</span>`;b.onclick=()=>{selected=selected===date?null:date;render()};$('grid').append(b)}$('filter').textContent=selected?`已選取 ${selected}`:'顯示整個月份';let counts={};list.forEach(e=>counts[e.categoryId]=(counts[e.categoryId]||0)+1);$('stats').innerHTML=data.categories.filter(c=>counts[c.id]).map(c=>`<span class="chip"><i class="badge" style="background:${c.color}"></i>${esc(c.name)} ${counts[c.id]} 筆</span>`).join('')||'<span class="muted">本月尚無紀錄</span>';let shown=list.filter(e=>!selected||e.date===selected).sort((a,b)=>(b.date+' '+(b.time||'')).localeCompare(a.date+' '+(a.time||'')));$('listTitle').textContent=selected?`${selected} 的紀錄`:'本月紀錄';$('count').textContent=`${shown.length} 筆`;$('entries').innerHTML=shown.map(e=>{let c=category(e.categoryId);return `<article class="entry"><div class="row between"><strong>${esc(e.date)} ${esc(e.time||'')}</strong><span class="row"><button data-edit="${esc(e.id)}">編輯</button><button data-delete="${esc(e.id)}" style="background:#fff0f0;color:#b44343">刪除</button></span></div><div style="margin:8px 0"><i class="badge" style="background:${c.color}"></i>${esc(c.name)}</div><div style="white-space:pre-wrap">${esc(e.note)}</div><div>${(e.photos||[]).map(p=>`<img alt="紀錄照片" src="${p}">`).join('')}</div></article>`}).join('')||'<p class="muted">目前沒有紀錄，點右下角新增一筆吧。</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('確定刪除這筆紀錄嗎？'))return;const old=data.entries;data.entries=data.entries.filter(e=>e.id!==b.dataset.delete);if(!save())data.entries=old;render()})}function openEditor(id=null){editId=id;let e=data.entries.find(x=>x.id===id);$('editorTitle').textContent=e?'編輯紀錄':'新增紀錄';$('date').value=e?.date||selected||iso(year,month,now.getDate()<=new Date(year,month+1,0).getDate()?now.getDate():1);if(!e&&!selected&&!(year===now.getFullYear()&&month===now.getMonth()))$('date').value=iso(year,month,1);$('time').value=e?.time||'';$('note').value=e?.note||'';$('category').innerHTML=data.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');$('category').value=e?.categoryId||data.categories[0]?.id;keptPhotos=[...(e?.photos||[])];$('files').value='';preview();$('editor').showModal()}function preview(){$('photoPreview').innerHTML=keptPhotos.map((p,i)=>`<div><img src="${p}"><button type="button" data-remove="${i}" class="small">移除</button></div>`).join('');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{keptPhotos.splice(Number(b.dataset.remove),1);preview()})}function readFile(f){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}function settingsRender(){$('categories').innerHTML=data.categories.map(c=>`<div class="row" style="margin:8px 0"><input type="color" value="${c.color}" data-color="${esc(c.id)}"><input type="text" value="${esc(c.name)}" data-name="${esc(c.id)}" style="flex:1"></div>`).join('');document.querySelectorAll('[data-color]').forEach(el=>el.oninput=()=>{category(el.dataset.color).color=el.value;save();render()});document.querySelectorAll('[data-name]').forEach(el=>el.onchange=()=>{let v=el.value.trim();if(v){category(el.dataset.name).name=v;save();render()}})}$('cat').onchange=e=>{catId=e.target.value;selected=null;render()};$('addCat').onclick=()=>{let name=prompt('請輸入貓咪名字');if(!name?.trim())return;let id='c'+Date.now();data.cats.push({id,name:name.trim()});catId=id;save();selected=null;render()};$('prev').onclick=()=>{month--;if(month<0){month=11;year--}selected=null;render()};$('next').onclick=()=>{month++;if(month>11){month=0;year++}selected=null;render()};$('clear').onclick=()=>{selected=null;render()};$('new').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').close();$('form').onsubmit=async e=>{e.preventDefault();let photos=await Promise.all([...$('files').files].map(readFile));let item={id:editId||'e'+Date.now(),catId,date:$('date').value,time:$('time').value,categoryId:$('category').value,note:$('note').value,photos:[...keptPhotos,...photos]};let old=JSON.parse(JSON.stringify(data.entries));if(editId)data.entries=data.entries.map(x=>x.id===editId?item:x);else data.entries.push(item);if(!save()){data.entries=old;return}let [y,m]=item.date.split('-').map(Number);year=y;month=m-1;selected=item.date;$('editor').close();render()};$('settings').onclick=()=>{settingsRender();$('settingsDialog').showModal()};$('closeSettings').onclick=()=>$('settingsDialog').close();$('addCategory').onclick=()=>{let name=$('newCategory').value.trim();if(!name)return;data.categories.push({id:'t'+Date.now(),name,color:$('newColor').value});$('newCategory').value='';save();settingsRender();render()};render();</script></body></html>
