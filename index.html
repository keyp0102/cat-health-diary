<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>多貓健康日記</title>
<meta name="theme-color" content="#27877e">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#28333a;background:#f6f8f7}*{box-sizing:border-box}body{margin:0}.app{max-width:640px;margin:auto;padding:18px 15px 80px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:8px 0}button,select,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:9px 13px;background:#e5efed;color:#244b48}button.primary{background:#27877e;color:white}button:disabled{opacity:.45;cursor:not-allowed}.card{background:white;border-radius:18px;padding:15px;margin:15px 0;box-shadow:0 3px 16px #1c3d3810}.muted{color:#71817e;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}select,input,textarea{border:1px solid #dbe5e2;border-radius:10px;padding:10px;background:white;max-width:100%}select{flex:1}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week{color:#81908b;font-size:13px;margin:16px 0 5px}.day{min-height:64px;border-radius:12px;background:transparent;padding:7px 2px;display:flex;align-items:center;flex-direction:column;gap:5px}.day.selected{background:#e4f3f0}.day.today .num{border:1px solid #27877e;border-radius:50%;width:27px;height:27px;display:grid;place-items:center}.dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}.dot{width:7px;height:7px;border-radius:50%}.stats{display:flex;gap:8px;flex-wrap:wrap}.chip{font-size:13px;background:#f3f6f5;border-radius:20px;padding:7px 10px}.entry{border-top:1px solid #eef1f0;padding:13px 0}.entry:first-of-type{border-top:0}.entry img{width:76px;height:76px;object-fit:cover;border-radius:10px;margin:5px 5px 0 0}.badge{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.fab{position:fixed;right:max(20px,calc((100vw - 640px)/2 + 20px));bottom:24px;border-radius:30px;box-shadow:0 4px 15px #0002;padding:14px 20px}dialog{border:0;border-radius:18px;width:min(94vw,520px);max-height:90vh;overflow:auto;padding:20px}dialog::backdrop{background:#0007}label{display:block;margin:12px 0 5px;font-size:14px}textarea{width:100%;min-height:95px}input[type=date],input[type=time],input[type=text]{width:100%}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.small{font-size:12px}.photos{display:flex;flex-wrap:wrap;gap:6px}.photos img{width:72px;height:72px;object-fit:cover;border-radius:8px}.hint{padding:9px;background:#fff8e7;border-radius:10px;font-size:12px;color:#795c25;margin:12px 0}.sync-ok{background:#e6f5ed;color:#27694c}.sync-bad{background:#fff0ed;color:#a23c35}.settings-cat{padding:8px 0;border-bottom:1px solid #eee}.category-row{display:flex;gap:8px;align-items:center;margin:8px 0}.category-row input[type=text]{flex:1;min-width:0}.category-row input[type=color]{padding:2px;width:46px;height:40px;flex:none}.danger{background:#fff0f0;color:#b44343}#syncStatus{white-space:pre-wrap}
</style></head>
<body><main class="app"><header><div><div class="muted">🐾 我的貓咪生活紀錄</div><h1>多貓健康日記</h1></div><button id="settings">⚙️ 設定</button></header>
<div class="hint" id="syncStatus" role="status">資料目前儲存在這台裝置，尚未連接 Google Drive。請勿清除 Safari 網站資料。</div>
<div class="card"><div class="row"><span>🐱</span><select id="cat"></select><button id="addCat">＋貓咪</button></div></div>
<section class="card"><div class="row between"><button id="prev">‹</button><strong id="month"></strong><button id="next">›</button></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="grid" class="grid"></div><div class="row between" style="margin-top:10px"><span class="muted" id="filter"></span><button id="clear">顯示整月</button></div></section>
<section class="card"><h3>本月事件統計</h3><div id="stats" class="stats"></div></section>
<section class="card"><div class="row between"><h3 id="listTitle">紀錄列表</h3><span class="muted" id="count"></span></div><div id="entries"></div></section><button class="primary fab" id="new">＋ 新增紀錄</button></main>
<dialog id="editor"><h3 id="editorTitle">新增紀錄</h3><form id="form"><label>日期</label><input id="date" type="date" required><label>時間（選填）</label><input id="time" type="time"><label>事件類別</label><select id="category" required></select><label>文字紀錄</label><textarea id="note" placeholder="今天發生什麼事？"></textarea><label>照片（可多選；建議小檔案）</label><input id="files" type="file" accept="image/*" multiple><div id="photoPreview" class="photos"></div><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">儲存</button></div></form></dialog>
<dialog id="settingsDialog"><h3>貓咪管理</h3><p class="muted">修改名字不影響已有紀錄。</p><div id="catSettings"></div><h3>事件分類與顏色</h3><p class="muted">所有貓咪共用，最多 10 個分類。停用分類不會刪除歷史紀錄。</p><div id="categories"></div><div class="row"><input id="newCategory" type="text" placeholder="新增分類名稱" style="flex:1"><input id="newColor" type="color" value="#459dd6"><button id="addCategory" type="button">新增</button></div><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><h3>☁️ Google Drive 同步</h3><p class="muted">資料會存到你的 Google Drive 中本 App 建立的備份檔。僅在開啟網頁並取得授權、網路正常時同步；iPhone 不支援保證背景即時同步。</p><div class="row"><button class="primary" id="connectDrive" type="button">連接 Google Drive</button><button id="syncNow" type="button">立即同步</button></div><p class="muted" id="syncDetail"></p><p class="muted">Google 測試模式可能要求重新授權。請確認顯示「已同步」再關閉網頁。</p><div class="actions"><button class="primary" id="closeSettings" type="button">完成</button></div></dialog>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
'use strict';
const CLIENT_ID='369292486178-9sbrfaa5gp4claaem4uf6doslan5du3i.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/drive.file';
const KEY='catDiaryPrototype_v1', CLOUD_KEY='catDiaryDriveFileId_v1', DIRTY_KEY='catDiaryDirty_v1';
const BACKUP_NAME='Cat Health Diary backup.json';
const defaults={cats:[{id:'c1',name:'小橘'},{id:'c2',name:'咪咪'}],categories:[['嘔吐','#3989dc'],['用藥','#4ba66a'],['看診','#e4b535'],['異常狀況','#e26666'],['排泄異常','#9367d1'],['疫苗','#ed8c42'],['體重','#97725a'],['其他','#8b959d'],['生活日記','#e789b1'],['飲食','#52bac6']].map((a,i)=>({id:'t'+i,name:a[0],color:a[1],active:true})),entries:[]};
const $=id=>document.getElementById(id), clone=o=>JSON.parse(JSON.stringify(o));
function valid(d){return d&&Array.isArray(d.cats)&&Array.isArray(d.categories)&&Array.isArray(d.entries)}
let data;try{let loaded=JSON.parse(localStorage.getItem(KEY));data=valid(loaded)?loaded:clone(defaults)}catch{data=clone(defaults)}
for(const c of data.categories)c.active=c.active!==false;
let catId=data.cats[0]?.id,now=new Date(),year=now.getFullYear(),month=now.getMonth(),selected=null,editId=null,keptPhotos=[];
let token=null,tokenExpiry=0,driveFileId=localStorage.getItem(CLOUD_KEY)||'',isSyncing=false,dirty=localStorage.getItem(DIRTY_KEY)==='1',syncTimer=null,requestTokenClient=null;
function iso(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(message,type=''){let el=$('syncStatus');el.textContent=message;el.className='hint '+(type==='ok'?'sync-ok':type==='bad'?'sync-bad':'');$('syncDetail').textContent=message}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));dirty=true;localStorage.setItem(DIRTY_KEY,'1');status('已儲存於手機，等待 Google Drive 同步。');scheduleSync();return true}catch(e){alert('儲存失敗，可能是照片太大或瀏覽器空間不足。請縮小照片再試。');return false}}
function cats(){$('cat').innerHTML=data.cats.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');if(!data.cats.some(c=>c.id===catId))catId=data.cats[0]?.id;$('cat').value=catId}
function category(id){return data.categories.find(c=>c.id===id)||{name:'未分類',color:'#999'}}
function filtered(){return data.entries.filter(e=>e.catId===catId&&typeof e.date==='string'&&e.date.startsWith(`${year}-${String(month+1).padStart(2,'0')}`))}
function render(){cats();$('month').textContent=`${year} 年 ${month+1} 月`;let list=filtered(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();$('grid').innerHTML='';for(let i=0;i<first;i++)$('grid').append(document.createElement('div'));for(let d=1;d<=days;d++){let date=iso(year,month,d),daily=list.filter(e=>e.date===date),colors=[...new Set(daily.map(e=>category(e.categoryId).color))],b=document.createElement('button');b.className='day'+(selected===date?' selected':'')+(date===iso(now.getFullYear(),now.getMonth(),now.getDate())?' today':'');b.innerHTML=`<span class="num">${d}</span><span class="dots">${colors.slice(0,5).map(c=>`<span class="dot" style="background:${/^#[0-9a-f]{6}$/i.test(c)?c:'#999'}"></span>`).join('')}${colors.length>5?'<small>+</small>':''}</span>`;b.onclick=()=>{selected=selected===date?null:date;render()};$('grid').append(b)}$('filter').textContent=selected?`已選取 ${selected}`:'顯示整個月份';let counts={};list.forEach(e=>counts[e.categoryId]=(counts[e.categoryId]||0)+1);$('stats').innerHTML=data.categories.filter(c=>counts[c.id]).map(c=>`<span class="chip"><i class="badge" style="background:${c.color}"></i>${esc(c.name)} ${counts[c.id]} 筆</span>`).join('')||'<span class="muted">本月尚無紀錄</span>';let shown=list.filter(e=>!selected||e.date===selected).sort((a,b)=>(b.date+' '+(b.time||'')).localeCompare(a.date+' '+(a.time||'')));$('listTitle').textContent=selected?`${selected} 的紀錄`:'本月紀錄';$('count').textContent=`${shown.length} 筆`;$('entries').innerHTML=shown.map(e=>{let c=category(e.categoryId);return `<article class="entry"><div class="row between"><strong>${esc(e.date)} ${esc(e.time||'')}</strong><span class="row"><button data-edit="${esc(e.id)}">編輯</button><button data-delete="${esc(e.id)}" class="danger">刪除</button></span></div><div style="margin:8px 0"><i class="badge" style="background:${c.color}"></i>${esc(c.name)}</div><div style="white-space:pre-wrap">${esc(e.note)}</div><div>${(e.photos||[]).filter(p=>typeof p==='string'&&p.startsWith('data:image/')).map(p=>`<img alt="紀錄照片" src="${p}">`).join('')}</div></article>`}).join('')||'<p class="muted">目前沒有紀錄，點右下角新增一筆吧。</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('確定刪除這筆紀錄嗎？'))return;let old=data.entries;data.entries=data.entries.filter(e=>e.id!==b.dataset.delete);if(!save())data.entries=old;render()})}
function openEditor(id=null){editId=id;let e=data.entries.find(x=>x.id===id),active=data.categories.filter(c=>c.active!==false);if(!active.length){alert('請先到設定新增至少一個事件分類。');return}$('editorTitle').textContent=e?'編輯紀錄':'新增紀錄';$('date').value=e?.date||selected||iso(year,month,now.getDate()<=new Date(year,month+1,0).getDate()?now.getDate():1);if(!e&&!selected&&!(year===now.getFullYear()&&month===now.getMonth()))$('date').value=iso(year,month,1);$('time').value=e?.time||'';$('note').value=e?.note||'';let options=[...active];if(e&&!options.some(c=>c.id===e.categoryId)){let old=category(e.categoryId);options.unshift({...old,id:e.categoryId})}$('category').innerHTML=options.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');$('category').value=e?.categoryId||active[0].id;keptPhotos=[...(e?.photos||[])];$('files').value='';preview();$('editor').showModal()}
function preview(){$('photoPreview').innerHTML=keptPhotos.map((p,i)=>`<div><img src="${p}"><button type="button" data-remove="${i}" class="small">移除</button></div>`).join('');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{keptPhotos.splice(Number(b.dataset.remove),1);preview()})}
function readFile(f){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}
function settingsRender(){$('catSettings').innerHTML=data.cats.map(c=>`<div class="row settings-cat"><input type="text" value="${esc(c.name)}" data-catname="${esc(c.id)}" style="flex:1"><button data-rename="${esc(c.id)}">改名</button></div>`).join('');document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{let id=b.dataset.rename,name=document.querySelector(`[data-catname="${id}"]`).value.trim();if(!name)return alert('貓咪名字不能空白');let old=clone(data);data.cats.find(c=>c.id===id).name=name;if(!save())data=old;settingsRender();render()});$('categories').innerHTML=data.categories.map(c=>`<div class="category-row"><input type="color" value="${c.color}" data-color="${esc(c.id)}"><input type="text" value="${esc(c.name)}" data-name="${esc(c.id)}"><label style="margin:0;white-space:nowrap;font-size:12px"><input type="checkbox" data-active="${esc(c.id)}" ${c.active!==false?'checked':''}> 啟用</label><button type="button" data-drop="${esc(c.id)}" class="danger small">移除</button></div>`).join('');document.querySelectorAll('[data-color]').forEach(el=>el.onchange=()=>{let old=clone(data);category(el.dataset.color).color=el.value;if(!save())data=old;render()});document.querySelectorAll('[data-name]').forEach(el=>el.onchange=()=>{let v=el.value.trim();if(!v)return alert('名稱不能空白');let old=clone(data);category(el.dataset.name).name=v;if(!save())data=old;render()});document.querySelectorAll('[data-active]').forEach(el=>el.onchange=()=>{let old=clone(data);category(el.dataset.active).active=el.checked;if(!save())data=old;render()});document.querySelectorAll('[data-drop]').forEach(el=>el.onclick=()=>{let id=el.dataset.drop;if(data.entries.some(e=>e.categoryId===id))return alert('這個項目已有歷史紀錄，為了保留紀錄不能刪除。你可以取消「啟用」，或直接修改項目名稱與顏色。');if(!confirm('確定移除這個尚無紀錄的分類？'))return;let old=clone(data);data.categories=data.categories.filter(c=>c.id!==id);if(!save())data=old;settingsRender();render()})}
$('cat').onchange=e=>{catId=e.target.value;selected=null;render()};$('addCat').onclick=()=>{let name=prompt('請輸入貓咪名字');if(!name?.trim())return;let old=clone(data),id='c'+Date.now();data.cats.push({id,name:name.trim()});if(!save()){data=old;return}catId=id;selected=null;render()};$('prev').onclick=()=>{month--;if(month<0){month=11;year--}selected=null;render()};$('next').onclick=()=>{month++;if(month>11){month=0;year++}selected=null;render()};$('clear').onclick=()=>{selected=null;render()};$('new').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').close();
$('form').onsubmit=async e=>{e.preventDefault();try{let photos=await Promise.all([...$('files').files].map(readFile)),item={id:editId||'e'+Date.now(),catId,date:$('date').value,time:$('time').value,categoryId:$('category').value,note:$('note').value,photos:[...keptPhotos,...photos]},old=clone(data);if(editId)data.entries=data.entries.map(x=>x.id===editId?item:x);else data.entries.push(item);if(!save()){data=old;return}let [y,m]=item.date.split('-').map(Number);year=y;month=m-1;selected=item.date;$('editor').close();render()}catch(err){alert('照片讀取失敗，請重試。')}};
$('settings').onclick=()=>{settingsRender();$('settingsDialog').showModal()};$('closeSettings').onclick=()=>$('settingsDialog').close();$('addCategory').onclick=()=>{let name=$('newCategory').value.trim();if(!name)return;if(data.categories.length>=10)return alert('最多只能建立 10 個分類；不需要的分類可以取消「啟用」。');let old=clone(data);data.categories.push({id:'t'+Date.now(),name,color:$('newColor').value,active:true});if(!save()){data=old;return}$('newCategory').value='';settingsRender();render()};
// Drive OAuth: the browser receives a short-lived access token; no client secret or long-lived token is stored.
function getToken(interactive=true){return new Promise((resolve,reject)=>{if(!window.google?.accounts?.oauth2)return reject(new Error('Google 登入元件尚未載入；請確認網路後重試。'));try{requestTokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:r=>{if(r.error)return reject(new Error(r.error));token=r.access_token;tokenExpiry=Date.now()+(Number(r.expires_in)||3500)*1000-60000;resolve(token)},error_callback:r=>reject(new Error(r.type||'Google 授權失敗'))});requestTokenClient.requestAccessToken({prompt:interactive?'consent':''})}catch(e){reject(e)}})}
function authenticated(){return !!token&&Date.now()<tokenExpiry}
async function api(url,opts={}){if(!authenticated())throw new Error('Google 授權已過期，請重新連接。');let h=new Headers(opts.headers||{});h.set('Authorization','Bearer '+token);let r=await fetch(url,{...opts,headers:h});if(!r.ok){let msg='Google Drive 回應 '+r.status;try{let v=await r.json();msg+='：'+(v.error?.message||'')}catch{}if(r.status===401){token=null;tokenExpiry=0}throw new Error(msg)}return r}
function persistCloudId(id){driveFileId=id;localStorage.setItem(CLOUD_KEY,id)}
async function findCloud(){if(driveFileId){try{let r=await api('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(driveFileId)+'?fields=id,name,trashed');let d=await r.json();if(!d.trashed)return d.id}catch(e){if(!String(e.message).includes('404'))throw e}driveFileId='';localStorage.removeItem(CLOUD_KEY)}let query=encodeURIComponent("name = '"+BACKUP_NAME.replace(/'/g,"\\'")+"' and trashed = false");let r=await api('https://www.googleapis.com/drive/v3/files?q='+query+'&fields=files(id,name,createdTime),nextPageToken&page_size=100&orderBy=createdTime%20desc');let files=(await r.json()).files||[];if(files.length){persistCloudId(files[0].id);return driveFileId}return null}
async function readCloud(id){let r=await api('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?alt=media');let d=await r.json();if(!valid(d))throw new Error('雲端備份格式不正確，已停止同步，以免覆蓋資料。');return d}
async function uploadCloud(snapshot){let blob=new Blob([JSON.stringify(snapshot)],{type:'application/json'});if(driveFileId){await api('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(driveFileId)+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:blob});return}let boundary='cat_diary_'+Date.now(),meta={name:BACKUP_NAME,mimeType:'application/json',description:'Cat Health Diary app backup'};let body=new Blob(['--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n',JSON.stringify(meta),'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n',blob,'\r\n--'+boundary+'--'],{type:'multipart/related; boundary='+boundary});let r=await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});let v=await r.json();if(!v.id)throw new Error('Google Drive 沒有回傳備份檔案 ID');persistCloudId(v.id)}
async function syncNow(){if(isSyncing||!authenticated())return;isSyncing=true;status('☁️ 正在同步 Google Drive…');let snapshot=clone(data),snapshotJson=JSON.stringify(snapshot);try{if(!driveFileId)await findCloud();if(!driveFileId){await uploadCloud(snapshot)}else if(dirty){await uploadCloud(snapshot)}else{let remote=await readCloud(driveFileId);data=remote;for(const c of data.categories)c.active=c.active!==false;localStorage.setItem(KEY,JSON.stringify(data));render()}if(JSON.stringify(data)===snapshotJson){dirty=false;localStorage.removeItem(DIRTY_KEY)}else{dirty=true;localStorage.setItem(DIRTY_KEY,'1')}status(dirty?'本機還有新變更，準備再次同步。':'✅ 已同步至 Google Drive（'+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})+'）',dirty?'':'ok')}catch(e){status('⚠️ 尚未同步：'+e.message+'\n紀錄仍在這台裝置，請勿清除 Safari 資料。','bad')}finally{isSyncing=false;if(dirty&&authenticated()&&JSON.stringify(data)!==snapshotJson)scheduleSync()}}
function scheduleSync(){clearTimeout(syncTimer);if(authenticated())syncTimer=setTimeout(syncNow,1200)}
$('connectDrive').onclick=async()=>{try{status('正在向 Google 要求授權…');await getToken(true);let existing=await findCloud();if(existing){let cloud=await readCloud(existing);let localHasData=data.entries.length>0;let remoteHasData=cloud.entries.length>0;if(localHasData&&remoteHasData&&JSON.stringify(data)!==JSON.stringify(cloud)){let useLocal=confirm('Google Drive 已經有備份資料。\n\n按「確定」：以這台手機的資料覆蓋雲端備份。\n按「取消」：保留雲端備份，並從雲端下載到手機。\n\n提醒：兩種選擇都不會自動合併紀錄，請確認後再選。');if(useLocal){dirty=true;localStorage.setItem(DIRTY_KEY,'1')}else{data=cloud;dirty=false;localStorage.removeItem(DIRTY_KEY);localStorage.setItem(KEY,JSON.stringify(data));render()}}else if(!localHasData&&remoteHasData){data=cloud;dirty=false;localStorage.removeItem(DIRTY_KEY);localStorage.setItem(KEY,JSON.stringify(data));render()}else if(localHasData&&!remoteHasData){dirty=true;localStorage.setItem(DIRTY_KEY,'1')}}else{dirty=true;localStorage.setItem(DIRTY_KEY,'1')}await syncNow()}catch(e){status('⚠️ 連接失敗：'+e.message+'\n手機裡的紀錄沒有被刪除。','bad')}};
$('syncNow').onclick=async()=>{if(!authenticated()){alert('請先按「連接 Google Drive」，重新授權。');return}await syncNow()};
window.addEventListener('online',()=>{if(authenticated())scheduleSync()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&authenticated()&&dirty)scheduleSync()});
render();status(dirty?'資料已儲存於手機，尚未同步。請到「設定」連接 Google Drive。':'資料目前儲存在這台裝置。請到「設定」連接 Google Drive；連接後請確認顯示「已同步」。');
</script></body></html>
